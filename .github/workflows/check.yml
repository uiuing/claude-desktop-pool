name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: python3 scripts/check-localization.py
      - run: zsh scripts/build.sh --universal
      - run: python3 scripts/check-package.py
      - run: python3 scripts/check-packaged-bridge.py
